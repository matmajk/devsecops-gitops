deploymentMode: Monolithic
loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage:
    type: filesystem
  limits_config:
    allow_structured_metadata: true

singleBinary:
  replicas: 1
  persistence:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 512Mi

# Local development does not need dedicated reverse proxy.
gateway:
  enabled: false

# Disable additional validation workloads.
lokiCanary:
  enabled: false

test:
  enabled: false

# Dedicated Memcached instances are unnecessary for a
# resource-constrained single-instance environment.
chunksCache:
  enabled: false

resultsCache:
  enabled: false

# No object-storage emulator is required when filesystem
# storage is used locally.
minio:
  enabled: false

# Disable all non-monolithic deployment targets.
backend:
  replicas: 0

read:
  replicas: 0

write:
  replicas: 0

ingester:
  replicas: 0

querier:
  replicas: 0

queryFrontend:
  replicas: 0

queryScheduler:
  replicas: 0

distributor:
  replicas: 0

compactor:
  replicas: 0

indexGateway:
  replicas: 0

bloomPlanner:
  replicas: 0

bloomBuilder:
  replicas: 0

bloomGateway:
  replicas: 0