apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-alloy-local
  namespace: argocd
spec:
  project: observability
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: alloy
      targetRevision: 1.12.1
      helm:
        releaseName: alloy
        valueFiles:
          - $values/environments/local/observability/alloy-values.yaml
    - repoURL: https://github.com/matmajk/devsecops-gitops.git
      targetRevision: master
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ServerSideApply=true