apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: observability-jaeger-local
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: observability
  sources:
    - repoURL: https://jaegertracing.github.io/helm-charts
      chart: jaeger
      targetRevision: 4.12.0
      helm:
        releaseName: jaeger
        valueFiles:
          - $values/environments/local/observability/jaeger-values.yaml
    - repoURL: https://github.com/matmajk/devsecops-gitops.git
      targetRevision: master
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ServerSideApply=true