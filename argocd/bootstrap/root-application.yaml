apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-root
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/matmajk/devsecops-gitops.git
      targetRevision: master
      path: argocd/projects
      directory:
        recurse: true
    - repoURL: https://github.com/matmajk/devsecops-gitops.git
      targetRevision: master
      path: argocd/applications
      directory:
        recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - PruneLast=true