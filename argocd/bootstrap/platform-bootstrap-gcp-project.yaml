apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform-bootstrap-gcp
  namespace: argocd
spec:
  description: Restricted bootstrap project for the GCP GitOps root
  sourceRepos:
    - https://github.com/matmajk/devsecops-gitops.git
  destinations:
    - namespace: argocd
      server: https://kubernetes.default.svc
  namespaceResourceWhitelist:
    - group: argoproj.io
      kind: Application
    - group: argoproj.io
      kind: AppProject