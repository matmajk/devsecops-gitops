apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-root-gcp
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform-bootstrap-gcp
  source:
    repoURL: https://github.com/matmajk/devsecops-gitops.git
    targetRevision: refs/heads/feat/gcp-gitops-environmentrefs/heads/master
    path: argocd/gcp
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - PruneLast=true