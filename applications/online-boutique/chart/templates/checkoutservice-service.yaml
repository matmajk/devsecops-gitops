{{- if .Values.checkoutService.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: checkoutservice
  labels:
    {{- include "online-boutique.componentLabels" (dict
      "root" .
      "name" "checkoutservice"
      "component" "checkout"
    ) | nindent 4 }}
spec:
  type: {{ .Values.checkoutService.service.type }}
  selector:
    app.kubernetes.io/name: checkoutservice
  ports:
    - name: grpc
      port: {{ .Values.checkoutService.service.port }}
      targetPort: {{ .Values.checkoutService.service.targetPort }}
      protocol: TCP
{{- end }}
