{{- if .Values.cartService.enabled }}
apiVersion: v1
kind: ServiceAccount

metadata:
  name: cartservice

  labels:
    {{- include "online-boutique.componentLabels" (dict
      "root" .
      "name" "cartservice"
      "component" "cart"
    ) | nindent 4 }}

automountServiceAccountToken: false
# This service account is used by the frontend pod to access other services in the cluster. It does not need a token for external access (e.g., for internal cluster communication).
{{- end }}
