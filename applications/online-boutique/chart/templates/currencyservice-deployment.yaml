{{- if .Values.currencyService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: currencyservice
  labels:
    {{- include "online-boutique.labels" . | nindent 4 }}
    app.kubernetes.io/name: currencyservice
    app.kubernetes.io/component: catalog
spec:
  replicas: {{ .Values.currencyService.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: currencyservice
  template:
    metadata:
      labels:
        app.kubernetes.io/name: currencyservice
        app.kubernetes.io/component: catalog
        app.kubernetes.io/part-of: online-boutique
    spec:
      serviceAccountName: currencyservice
      terminationGracePeriodSeconds: 5
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: currencyservice
          image: "{{ .Values.global.imageRepository }}/{{ .Values.currencyService.image.name }}:{{ .Values.global.imageTag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: grpc
              containerPort: {{ .Values.currencyService.containerPort }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.currencyService.containerPort | quote }}
            - name: DISABLE_PROFILER
              value: "1"
          readinessProbe:
            grpc:
              port: {{ .Values.currencyService.containerPort }}
          livenessProbe:
            grpc:
              port: {{ .Values.currencyService.containerPort }}
          resources:
            {{- toYaml .Values.currencyService.resources | nindent 12 }}
{{- end }}
