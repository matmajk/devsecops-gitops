{{- if .Values.shippingService.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: shippingservice
  labels:
    {{- include "online-boutique.componentLabels" (dict
      "root" .
      "name" "shippingservice"
      "component" "shipping"
    ) | nindent 4 }}
spec:
  type: {{ .Values.shippingService.service.type }}
  selector:
    app.kubernetes.io/name: shippingservice
  ports:
    - name: grpc
      port: {{ .Values.shippingService.service.port }}
      targetPort: {{ .Values.shippingService.service.targetPort }}
      protocol: TCP
{{- end }}
