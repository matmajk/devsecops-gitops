{{- if .Values.adService.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: adservice
  labels:
    {{- include "online-boutique.componentLabels" (dict
      "root" .
      "name" "adservice"
      "component" "catalog"
    ) | nindent 4 }}
spec:
  type: {{ .Values.adService.service.type }}
  selector:
    app.kubernetes.io/name: adservice
  ports:
    - name: grpc
      port: {{ .Values.adService.service.port }}
      targetPort: {{ .Values.adService.service.targetPort }}
      protocol: TCP
{{- end }}
