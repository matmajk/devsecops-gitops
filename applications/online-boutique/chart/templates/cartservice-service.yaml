{{- if .Values.cartService.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: cartservice
  labels:
    {{- include "online-boutique.labels" . | nindent 4 }}
    app.kubernetes.io/name: cartservice
    app.kubernetes.io/component: cart
spec:
  type: {{ .Values.cartService.service.type }}
  selector:
    app.kubernetes.io/name: cartservice
  ports:
    - name: grpc
      port: {{ .Values.cartService.service.port }}
      targetPort: {{ .Values.cartService.service.targetPort }}
      protocol: TCP
{{- end }}
