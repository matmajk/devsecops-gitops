{{- if .Values.shippingService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shippingservice
  labels:
    {{- include "online-boutique.labels" . | nindent 4 }}
    app.kubernetes.io/name: shippingservice
    app.kubernetes.io/component: shipping
spec:
  replicas: {{ .Values.shippingService.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: shippingservice
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shippingservice
        app.kubernetes.io/component: shipping
        app.kubernetes.io/part-of: online-boutique
    spec:
      serviceAccountName: shippingservice
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: shippingservice
          image: "{{ .Values.global.imageRepository }}/{{ .Values.shippingService.image.name }}:{{ .Values.global.imageTag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: grpc
              containerPort: {{ .Values.shippingService.containerPort }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.shippingService.containerPort | quote }}
            - name: DISABLE_PROFILER
              value: "1"
          readinessProbe:
            periodSeconds: {{ .Values.shippingService.probes.readiness.periodSeconds }}
            grpc:
              port: {{ .Values.shippingService.containerPort }}
          livenessProbe:
            periodSeconds: {{ .Values.shippingService.probes.liveness.periodSeconds }}
            grpc:
              port: {{ .Values.shippingService.containerPort }}
          resources:
            {{- toYaml .Values.shippingService.resources | nindent 12 }}
{{- end }}
