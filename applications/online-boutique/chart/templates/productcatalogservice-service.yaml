{{- if .Values.productCatalogService.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: productcatalogservice
  labels:
    {{- include "online-boutique.componentLabels" (dict
      "root" .
      "name" "productcatalogservice"
      "component" "catalog"
    ) | nindent 4 }}
spec:
  type: {{ .Values.productCatalogService.service.type }}
  selector:
    app.kubernetes.io/name: productcatalogservice
  ports:
    - name: grpc
      port: {{ .Values.productCatalogService.service.port }}
      targetPort: {{ .Values.productCatalogService.service.targetPort }}
      protocol: TCP
{{- end }}
