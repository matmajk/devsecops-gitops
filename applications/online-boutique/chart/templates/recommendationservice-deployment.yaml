{{- if .Values.recommendationService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendationservice
  labels:
    {{- include "online-boutique.labels" . | nindent 4 }}
    app.kubernetes.io/name: recommendationservice
    app.kubernetes.io/component: catalog
spec:
  replicas: {{ .Values.recommendationService.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: recommendationservice
  template:
    metadata:
      labels:
        app.kubernetes.io/name: recommendationservice
        app.kubernetes.io/component: catalog
        app.kubernetes.io/part-of: online-boutique
    spec:
      serviceAccountName: recommendationservice
      terminationGracePeriodSeconds: 5
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: recommendationservice
          image: "{{ .Values.global.imageRepository }}/{{ .Values.recommendationService.image.name }}:{{ .Values.global.imageTag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: grpc
              containerPort: {{ .Values.recommendationService.containerPort }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.recommendationService.containerPort | quote }}
            - name: PRODUCT_CATALOG_SERVICE_ADDR
              value: {{ .Values.recommendationService.dependencies.productCatalogService | quote }}
            - name: DISABLE_PROFILER
              value: "1"
          readinessProbe:
            periodSeconds: 5
            grpc:
              port: {{ .Values.recommendationService.containerPort }}
          livenessProbe:
            periodSeconds: 5
            grpc:
              port: {{ .Values.recommendationService.containerPort }}
          resources:
            {{- toYaml .Values.recommendationService.resources | nindent 12 }}
{{- end }}
