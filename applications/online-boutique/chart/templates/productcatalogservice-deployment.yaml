{{- if .Values.productCatalogService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: productcatalogservice
  labels:
    {{- include "online-boutique.labels" . | nindent 4 }}
    app.kubernetes.io/name: productcatalogservice
    app.kubernetes.io/component: catalog
spec:
  replicas: {{ .Values.productCatalogService.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: productcatalogservice
  template:
    metadata:
      labels:
        app.kubernetes.io/name: productcatalogservice
        app.kubernetes.io/component: catalog
        app.kubernetes.io/part-of: online-boutique
    spec:
      serviceAccountName: productcatalogservice
      terminationGracePeriodSeconds: 5
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: productcatalogservice
          image: "{{ .Values.global.imageRepository }}/{{ .Values.productCatalogService.image.name }}:{{ .Values.global.imageTag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: grpc
              containerPort: {{ .Values.productCatalogService.containerPort }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.productCatalogService.containerPort | quote }}
            - name: DISABLE_PROFILER
              value: "1"
          readinessProbe:
            grpc:
              port: {{ .Values.productCatalogService.containerPort }}
          livenessProbe:
            grpc:
              port: {{ .Values.productCatalogService.containerPort }}
          resources:
            {{- toYaml .Values.productCatalogService.resources | nindent 12 }}
{{- end }}
